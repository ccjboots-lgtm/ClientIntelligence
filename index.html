<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Client intelligence: standardised insights view</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F4FA;--surface:#FFFFFF;--ink:#14213D;--muted:#5D6A85;--line:#E0E6F0;
  --accent:#1F5FD1;--accent-soft:#E7EEFC;--accent-ink:#164AA8;
  --good:#16874F;--good-soft:#E0F4E9;--warn:#A25E00;--warn-soft:#FCEFD6;--gap:#B03144;--gap-soft:#FCE8EB;
  --c-meet:#1F5FD1;--c-mail:#16874F;--c-portal:#D08A12;
  --nav:#0F2D63;--nav-on:#2B5BB5;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1424;--surface:#151E32;--ink:#E7ECF6;--muted:#9AA7C2;--line:#25304A;
    --accent:#7FA4FF;--accent-soft:#1B2A52;--accent-ink:#BCCFFF;
    --good:#4CC9A0;--good-soft:#12322B;--warn:#F0B35A;--warn-soft:#3A2B10;--gap:#F2909F;--gap-soft:#3B1A22;
    --c-meet:#7FA4FF;--c-mail:#4CC9A0;--c-portal:#E6A445;--nav:#0A1E47;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1424;--surface:#151E32;--ink:#E7ECF6;--muted:#9AA7C2;--line:#25304A;
  --accent:#7FA4FF;--accent-soft:#1B2A52;--accent-ink:#BCCFFF;
  --good:#4CC9A0;--good-soft:#12322B;--warn:#F0B35A;--warn-soft:#3A2B10;--gap:#F2909F;--gap-soft:#3B1A22;
  --c-meet:#7FA4FF;--c-mail:#4CC9A0;--c-portal:#E6A445;--nav:#0A1E47;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 84px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:40}
h1,h2,h3,p,ul,ol,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-columns:184px minmax(0,1fr);min-height:100vh}
.side{background:var(--nav);color:#fff;position:sticky;top:0;align-self:start;height:100vh;padding:18px 12px;display:flex;flex-direction:column;gap:22px}
.logo{display:flex;align-items:center;gap:10px;padding:0 6px}
.logo i{width:34px;height:34px;border-radius:8px;background:#fff;color:var(--nav);display:grid;place-items:center;font-style:normal;font-weight:600;font-size:13px}
.logo b{font-weight:600;font-size:14px;line-height:1.2}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;background:none;border:0;color:rgba(255,255,255,.82);padding:10px 12px;border-radius:8px;text-align:left;font-size:14px}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button[aria-current="page"]{background:var(--nav-on);color:#fff;font-weight:500}
.nav button[disabled]{opacity:.45;cursor:default}
.nav button[disabled]:hover{background:none}
.nav small{margin-left:auto;font-size:11px;background:rgba(255,255,255,.14);border-radius:999px;padding:1px 7px}
.page{min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{padding:12px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ttl{margin-right:auto}
.ttl b{display:block;font-size:17px;font-weight:600;line-height:1.2;color:var(--accent-ink)}
.ttl small{color:var(--muted);font-size:12px}
.search{position:relative;flex:1 1 240px;max-width:340px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px 9px 38px}
.res{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(15,29,60,.14);z-index:50;max-height:320px;overflow:auto}
.res button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-top:1px solid var(--line)}
.res button:first-child{border-top:0}
.res button:hover,.res button:focus-visible{background:var(--accent-soft)}
.res small{display:block;color:var(--muted);font-size:12px}
.ctl{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 10px;height:38px}
.ctl select{background:transparent;border:0;padding:0 6px 0 0;font-weight:500;max-width:210px}
.ctl .m{width:22px;height:22px;border-radius:5px;background:var(--nav);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:600}
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.av{width:36px;height:36px;border-radius:50%;background:#C8343F;color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.av.sm{width:34px;height:34px;font-size:12px;background:var(--accent-soft);color:var(--accent-ink)}
.me{display:flex;align-items:center;gap:10px;margin-left:4px}
.me b{display:block;font-size:13.5px;font-weight:600;line-height:1.2}
.me small{display:block;font-size:12px;color:var(--muted)}
.content{padding:20px 24px 48px;max-width:1160px}
.head{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.mono{width:54px;height:54px;border-radius:12px;background:var(--nav);color:#fff;display:grid;place-items:center;font-size:19px;font-weight:600;flex:none}
h1{font-size:26px;line-height:1.15;font-weight:600;letter-spacing:-0.01em}
.facts{display:flex;gap:6px 16px;flex-wrap:wrap;margin-top:6px;color:var(--muted);font-size:13px}
.facts span{display:inline-flex;align-items:center;gap:6px}
.facts svg.i{width:16px;height:16px;color:var(--accent)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:18px 0 16px;overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 16px;color:var(--muted);font-size:14px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent-ink);font-weight:500;border-bottom-color:var(--accent)}
.tabs button[disabled]{opacity:.55;cursor:default}
.lt{font-size:11px;margin-left:6px;background:var(--bg);border-radius:999px;padding:1px 7px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;background:var(--accent-soft);border-radius:16px;padding:12px}
.key{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-align:left;width:100%;min-width:0}
button.key{cursor:pointer}
button.key:hover{border-color:var(--accent)}
.key.k-warn{border-color:var(--warn);background:var(--surface)}
.kh{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px;line-height:1.3}
.kic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink);flex:none}
.k-warn .kic{background:var(--warn-soft);color:var(--warn)}
.k-good .kic{background:var(--good-soft);color:var(--good)}
.kst{margin-left:auto;flex:none;font-size:12px;border-radius:999px;padding:2px 9px;background:var(--bg);color:var(--muted);white-space:nowrap}
.k-warn .kst{background:var(--warn-soft);color:var(--warn);font-weight:500}
.k-good .kst{background:var(--good-soft);color:var(--good)}
.kv{font-size:28px;font-weight:600;letter-spacing:-0.02em;line-height:1.1}
.kv small{font-size:13px;font-weight:400;color:var(--muted);letter-spacing:0}
.segs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.segs i{height:8px;border-radius:4px;background:var(--line)}
.segs i.on{background:var(--accent)}
.segs i.cur{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.trk{position:relative;height:8px;border-radius:4px;background:var(--bg)}
.trk i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--accent)}
.k-warn .trk i{background:var(--warn)}
.k-good .trk i{background:var(--good)}
.trk u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.trk b{position:absolute;top:-3px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--accent);transform:translateX(-50%)}
.k-warn .trk b{border-color:var(--warn)}
.tl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.ks{font-size:13.5px;font-weight:500;line-height:1.35;color:var(--accent-ink)}
.k-warn .ks{color:var(--warn)}
.k-good .ks{color:var(--good)}
.kn{font-size:12.5px;color:var(--muted);margin-top:auto}
@media (max-width:1100px){.keys{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.keys{grid-template-columns:minmax(0,1fr)}}
.card,.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.kpi{padding:14px 16px 13px;text-align:left;display:block;width:100%;border-top:3px solid var(--accent)}
.kpi.click:hover{border-color:var(--accent)}
.kpi.flag{border-color:var(--warn);background:var(--warn-soft)}
.kpi .l{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;line-height:1.3}
.kpi .l svg.i{color:var(--accent)}
.kpi .l .go{margin-left:auto;width:15px;height:15px;color:var(--muted)}
.kpi .v{font-size:26px;font-weight:600;letter-spacing:-0.01em;margin-top:8px;line-height:1.2}
.kpi .d{font-size:12.5px;margin-top:3px;color:var(--muted)}
.d.good{color:var(--good)}.d.warn{color:var(--warn);font-weight:500}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:12px}
.panel{padding:16px 18px}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.ph svg.i{color:var(--accent)}
.ph h2{font-size:15px;font-weight:600}
.ph .r{margin-left:auto}
.sub{color:var(--muted);font-size:12.5px;margin-bottom:12px}
.acc{margin-top:12px;padding:0}
.ah{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:14px 18px;text-align:left;border-radius:12px}
.ah:hover{background:var(--bg)}
.ah svg.i{color:var(--accent)}
.ah h2{font-size:15px;font-weight:600}
.ah .as{margin-left:auto;color:var(--muted);font-size:13px;text-align:right}
.ah .chv{color:var(--muted);transition:transform .15s}
.ah[aria-expanded="true"] .chv{transform:rotate(90deg)}
.ab{padding:2px 18px 18px;border-top:1px solid var(--line);padding-top:16px;margin:0 0 0}
.rail{display:flex}
.rail li{flex:1;text-align:center;position:relative;font-size:12.5px;color:var(--muted)}
.rail li button{background:none;border:0;width:100%;padding:26px 4px 8px;border-radius:8px;color:inherit;font:inherit;font-weight:inherit}
.rail li button:hover{background:var(--bg)}
.rail li.sel button{background:var(--accent-soft);color:var(--accent-ink)}
.rail li small{display:block;font-size:11.5px;font-weight:400;color:var(--muted);margin-top:2px}
.rail li.sel small{color:var(--accent-ink)}
.rail li::before{content:"";position:absolute;top:8px;left:-50%;width:100%;height:2px;background:var(--line)}
.rail li:first-child::before{display:none}
.rail li::after{content:"";position:absolute;top:1px;left:calc(50% - 8px);width:16px;height:16px;border-radius:50%;background:var(--surface);border:2px solid var(--line)}
.rail li.done::before,.rail li.now::before{background:var(--accent)}
.rail li.done::after{background:var(--accent);border-color:var(--accent)}
.rail li.now::after{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.rail li.now{color:var(--ink);font-weight:600}
.zoom{margin-top:14px;border-top:1px solid var(--line);padding-top:14px;display:grid;grid-template-columns:minmax(0,1.4fr) repeat(3,minmax(0,1fr));gap:14px}
.zoom .n b{font-size:16px;font-weight:600}
.zoom p{color:var(--muted);font-size:13px;margin-top:4px}
.zoom .f small{display:block;color:var(--muted);font-size:12.5px}
.zoom .f b{display:block;font-size:15px;font-weight:600;margin-top:2px}
.chip{display:inline-block;font-size:12px;border-radius:999px;padding:1px 9px;margin-left:8px;vertical-align:1px;background:var(--bg);color:var(--muted)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.acc{background:var(--accent-soft);color:var(--accent-ink)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-weight:500;color:var(--muted);font-size:12.5px;text-align:left;padding:8px 8px 8px 0;border-bottom:1px solid var(--line)}
td{padding:11px 8px 11px 0;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th.n,td.n{text-align:right;padding-right:0}
.cov{display:flex;align-items:center;gap:10px;min-width:130px}
.bar{flex:1;height:7px;border-radius:4px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.call{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border-radius:10px;padding:12px 14px;margin-top:12px;color:var(--accent-ink);font-size:13px}
.call svg.i{margin-top:1px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-top:8px}
.row:first-of-type{margin-top:0}
.row:hover{border-color:var(--accent)}
.row .t{flex:1;min-width:0}
.row b{display:block;font-weight:600;font-size:14px;line-height:1.3}
.row small{display:block;color:var(--muted);font-size:12.5px}
.row .tag{font-size:12px;border-radius:999px;padding:1px 8px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
.row .ok{background:var(--good-soft);color:var(--good)}
.row svg.i{color:var(--muted)}
.km{padding:10px 0;border-top:1px solid var(--line)}
.km:first-of-type{border-top:0;padding-top:0}
.km small{display:block;color:var(--muted);font-size:12.5px}
.km b{display:block;font-weight:500;font-size:14.5px;margin-top:2px}
.km .miss{color:var(--gap);font-weight:400}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tc{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;min-height:118px}
.tc b{font-weight:500;font-size:13.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tc small{color:var(--muted);font-size:12px}
.tc time{margin-top:auto;font-size:12px;color:var(--muted)}
.ico{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none}
.t-meet{background:var(--accent-soft);color:var(--c-meet)}
.t-mail{background:var(--good-soft);color:var(--c-mail)}
.t-portal{background:var(--warn-soft);color:var(--c-portal)}
.link{background:none;border:0;color:var(--accent-ink);font-weight:500;padding:0;display:inline-flex;align-items:center;gap:4px}
.link svg.i{width:15px;height:15px}
.bar-t{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{background:none;border:0;border-radius:7px;padding:6px 14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:0 0 0 1px var(--line)}
.sw{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer;margin-left:auto}
.sw input{width:16px;height:16px;accent-color:var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pchip,.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;color:var(--muted)}
.pchip[aria-pressed="true"],.fchip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:500}
.fchip[disabled]{opacity:.55;cursor:default}
.kpi.off{opacity:.55}
.cover{margin-top:12px;font-size:13px;color:var(--muted)}
.cover b{color:var(--ink);font-weight:500}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
.cols li{padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
.cols li:first-child{border-top:0;padding-top:2px}
.src{display:none;margin-top:3px;font-size:12px;color:var(--muted);align-items:center;gap:6px}
.src::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
body.show-src .src{display:flex}
.empty{font-size:13.5px;color:var(--gap);background:var(--gap-soft);border-radius:10px;padding:12px 14px}
.empty small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.ev{display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ev:first-of-type{border-top:0}
.ev b{font-weight:500;display:block}
.ev small{color:var(--muted);font-size:12.5px}
.ev time{color:var(--muted);font-size:12.5px;text-align:right;white-space:nowrap}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap;margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.rh{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px;color:var(--muted);font-size:12.5px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:20px;width:min(640px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(10,20,40,.5)}
dialog h2{font-size:17px;font-weight:600}
dialog textarea{width:100%;height:300px;margin-top:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:12px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.dact{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:12px}
.dact span{margin-right:auto;color:var(--muted);font-size:13px}
.foot{margin-top:28px;color:var(--muted);font-size:12.5px}
.nw{padding:14px 0;border-top:1px solid var(--line)}
.nw:first-of-type{border-top:0;padding-top:2px}
.nw .m{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12.5px}
.nw b{display:block;font-weight:600;font-size:15px;margin-top:5px;line-height:1.35}
.nw p{color:var(--muted);font-size:13.5px;margin-top:2px}
.nw .ang{margin-top:8px;display:flex;gap:8px;align-items:flex-start;background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:8px 10px;font-size:13px}
.nw .ang svg.i{width:16px;height:16px;margin-top:1px}
.tg{font-size:12px;border-radius:999px;padding:1px 9px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
@media (max-width:1100px){.mt{display:none}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;flex-direction:row;align-items:center;padding:10px 12px;gap:12px;overflow-x:auto}
  .logo b{display:none}
  .nav{flex-direction:row}

  };
  const stageSo=b.stage<STAGES.length-1?'Next: '+STAGES[b.stage+1]+(nx?', expected '+fmtM(D(nx)):', not planned yet'):'Renewal conversation under way';
  return card('','data-act="tab" data-v="journey"','flag','Journey stage','Stage '+(b.stage+1)+' of '+STAGES.length,STAGES[b.stage],stageSo,'Since '+fmt(D(b.dates[b.stage])))+
   card(soon?'k-warn':'','','clock','Contract ends',soon?'Renewal soon':'On track',fmtM(end),winOpen?'Renewal window is open':'Renewal window opens '+fmtM(D(win)),m>=1?m+' months left':'Ends this month')+
   card('','','euro','Contract volume',cov+'% in scope',b.value+' <small>a year</small>',t>s?(t-s)+' countries not yet in scope':'All countries in scope',s+' of '+t+' countries, '+b.scopeEmp.toLocaleString('en-GB')+' employees')+
   card(stale?'k-warn':'k-good','data-act="person" data-v="dm"','meet','Last decision maker contact',stale?'Reach out':'Recent',agoTxt(n),stale?'Plan a conversation':'Contact is fresh',esc(dm.name)+', '+dm.via.toLowerCase());
}

function journeyPage(b){return '<section class="panel"><div class="ph">'+ic('flag')+'<h2>Journey stages</h2></div>'+journeyBody(b)+'</section>';}
function footPage(b){return '<section class="panel"><div class="ph">'+ic('globe')+'<h2>Footprint by region</h2></div>'+footBody(b)+'</section>';}

function overview(b){
  const {t,s}=totals(b);const end=endDate(b);const m=monthsTo(end);const dm=b.people[0];const n=ago(dm.last);
  const soon=m<=4;
  const sd=b.dates[b.stage];
  const k=[
   kpi('flag','Journey stage',STAGES[b.stage],'Since '+fmtS(D(sd)),'','journey'),
   kpi('clock','Contract ends',fmtM(end),soon?'Renewal due in '+m+' months':'In '+m+' months',soon?'warn':'good'),
   kpi('euro','Contract volume',b.value+' <span style="font-size:13px;font-weight:400;color:var(--muted)">a year</span>',s+' of '+t+' countries','','footprint'),
   kpi('meet','Last decision maker contact',agoTxt(n),esc(dm.name),n>45?'warn':'good')].join('');
  const stk='<section class="panel" id="panel-stk"><div class="ph">'+ic('users')+'<h2>Key stakeholders</h2></div><p class="sub">Open a stakeholder to see their priorities.</p>'+
   b.people.map(p=>{const a=ago(p.last);return '<button class="row" data-act="person" data-v="'+p.id+'"><span class="av sm" aria-hidden="true">'+ini(p.name)+'</span><span class="t"><b>'+esc(p.name)+'</b><small>'+p.role+', '+esc(p.title)+'</small></span><span class="tag '+(a>45?'':'ok')+'">'+agoTxt(a)+'</span>'+ic('chev')+'</button>';}).join('')+'</section>';
  const top=(k,lab)=>'<div class="km"><small>'+lab+'</small>'+(b.biz[k].length?'<b>'+esc(b.biz[k][0].t)+'</b>':'<b class="miss">Not captured yet</b>')+'</div>';
  const mat='<section class="panel"><div class="ph">'+ic('target')+'<h2>What matters to them</h2><span class="r"><button class="link" data-act="tab" data-v="priorities">See all '+ic('chev')+'</button></span></div><p class="sub">The top item for the business.</p>'+
   top('pri','Top priority')+top('obj','Main objective')+top('cha','Biggest challenge')+'</section>';
  return '<div class="keys">'+keyCards(b)+'</div><div class="two">'+stk+mat+'</div>';
}

function slots(b){
  const out=[];const nm={pri:'priorities',obj:'objectives',cha:'challenges'};
  ['pri','obj','cha'].forEach(k=>out.push({ok:b.biz[k].length>0,lab:'Business '+nm[k]}));
  b.people.forEach(p=>['pri','obj','cha'].forEach(k=>out.push({ok:b.per[p.id][k].length>0,lab:p.role+' '+nm[k]})));
  return out;
}

function priorities(b){
  const lvl=S.level==='business';
  const data=lvl?b.biz:b.per[S.person];
  const who=b.people.find(p=>p.id===S.person);
  const sl=slots(b);const fill=sl.filter(x=>x.ok).length;
  const defs={pri:['target','Priorities','What matters most right now'],obj:['flag','Objectives','What they want to achieve'],cha:['alert','Challenges','What stands in the way']};
  return '<div class="bar-t"><div class="seg" role="group" aria-label="Level"><button data-act="level" data-v="business" aria-pressed="'+lvl+'">Business level</button><button data-act="level" data-v="person" aria-pressed="'+(!lvl)+'">Stakeholder level</button></div>'+
   '<label class="sw"><input type="checkbox" id="src"'+(S.src?' checked':'')+'> Show data sources</label></div>'+
   (lvl?'':'<div class="chips" role="group" aria-label="Stakeholder">'+b.people.map(p=>'<button class="pchip" data-act="person2" data-v="'+p.id+'" aria-pressed="'+(p.id===S.person)+'">'+esc(p.name)+', '+p.role.toLowerCase()+'</button>').join('')+'</div>')+
   '<p class="cover">Insights captured: <b>'+fill+' of '+sl.length+'</b></p>'+
   '<div class="cols">'+['pri','obj','cha'].map(k=>'<section class="panel"><div class="ph">'+ic(defs[k][0])+'<h2>'+defs[k][1]+'</h2></div><p class="sub">'+defs[k][2]+'</p>'+
     (data[k].length?'<ul>'+data[k].map(x=>'<li>'+esc(x.t)+'<span class="src">'+x.s+', '+x.d+'</span></li>').join('')+'</ul>':'<div class="empty">Not captured yet<small>'+(lvl?'Add it after the next account conversation.':'Ask '+esc(who.name.split(' ')[0])+' in your next conversation.')+'</small></div>')+'</section>').join('')+'</div>';
}

function newsPage(b){
  const items=[...NEWS[S.brand]].sort((x,y)=>y.d.localeCompare(x.d));
  return '<section class="panel"><div class="ph">'+ic('news')+'<h2>Latest company news</h2></div><p class="sub">Sample headlines. In the live version these are pulled from news sources and matched to the company name.</p>'+
   items.map(n=>'<article class="nw"><div class="m"><span>'+esc(n.src)+'</span><span>'+fmt(D(n.d))+'</span><span class="tg">'+n.theme+'</span></div><b>'+esc(n.title)+'</b><p>'+esc(n.sum)+'</p><div class="ang">'+ic('bulb')+'<span>'+esc(n.ang)+'</span></div></article>').join('')+'</section>';
}

function touchpoints(b){
  const meets=[...b.touch].filter(e=>e.t==='meet').sort((x,y)=>y.d.localeCompare(x.d));
  const per=meets.filter(inRange);
  const lm=meets[0];
  const later=(i,l)=>'<div class="card kpi off"><div class="l">'+ic(i)+'<span>'+l+'</span><span class="lt" style="margin-left:auto">Later</span></div><div class="v" style="font-size:18px">Not available yet</div><div class="d">Planned for a later phase</div></div>';
  const k=kpi('meet','Last meeting',lm?agoTxt(ago(lm.d)):'None yet',lm?esc(lm.who):'')+later('mail','Last email')+later('portal','Portal usage');
  const opts=[['30d','Last 30 days'],['3m','Last 3 months'],['12m','Last 12 months']].map(o=>'<option value="'+o[0]+'"'+(S.range===o[0]?' selected':'')+'>'+o[1]+'</option>').join('');
  return '<div class="kpis k3">'+k+'</div>'+
   '<section class="panel" style="margin-top:12px"><div class="ph">'+ic('meet')+'<h2>Meetings</h2><span class="r"><label class="ctl" style="height:34px">'+ic('meet')+'<select id="range" aria-label="Date range">'+opts+'</select></label></span></div>'+
   '<div class="chips" style="margin:8px 0 10px"><button class="fchip" aria-pressed="true">Meetings '+per.length+'</button><button class="fchip" disabled title="Planned for a later phase">Emails<span class="lt">Later</span></button><button class="fchip" disabled title="Planned for a later phase">Portal<span class="lt">Later</span></button></div>'+
   (per.length?per.map(e=>'<div class="ev">'+tic(e.t)+'<div><b>'+esc(e.title)+'</b><small>'+esc(e.who)+'</small></div><time datetime="'+e.d+'">'+fmt(D(e.d))+'<br>'+agoTxt(ago(e.d))+'</time></div>').join(''):'<div class="empty">No meetings in this period<small>Choose a longer date range.</small></div>')+'</section>';
}

function render(){
  const b=cur();
  $('bm').textContent=b.mono;$('brand').value=S.brand;
  renderNav();
  $('main').innerHTML=header(b)+(S.tab==='overview'?overview(b):S.tab==='journey'?journeyPage(b):S.tab==='footprint'?footPage(b):S.tab==='news'?newsPage(b):S.tab==='priorities'?priorities(b):touchpoints(b))+'<p class="foot">All names and figures are illustrative sample data, as of 25 Nov 2026.</p>';
  document.body.classList.toggle('show-src',S.src);
  const sw=$('src');if(sw)sw.addEventListener('change',e=>{S.src=e.target.checked;document.body.classList.toggle('show-src',S.src);});
  const rg=$('range');if(rg)rg.addEventListener('change',e=>{S.range=e.target.value;render();});
}

function brief(b){
  const {t,s}=totals(b);const end=endDate(b);
  const L=k=>b.biz[k].length?b.biz[k].map(x=>'- '+x.t).join('\n'):'- Not captured yet';
  const tp=[...b.touch].sort((x,y)=>y.d.localeCompare(x.d)).slice(0,3).map(e=>'- '+fmt(D(e.d))+', '+TYPE[e.t]+': '+e.title).join('\n');
  return 'Meeting brief: '+b.name+'\nPrepared '+fmt(REF)+' by Claire Boots, Account Manager, Region EMEA (sample data)\n\nACCOUNT\n'+b.model+' brand, '+t+' countries, about '+b.employees.toLocaleString('en-GB')+' employees\nStage: '+STAGES[b.stage]+'. Signed '+fmt(D(b.signed))+', ends '+fmt(end)+'\nVolume: '+s+' of '+t+' countries, '+b.scopeEmp.toLocaleString('en-GB')+' employees, '+b.value+' a year\n\nSTAKEHOLDERS\n'+
   b.people.map(p=>'- '+p.role+': '+p.name+', '+p.title+' (last contact '+agoTxt(ago(p.last))+')').join('\n')+
   '\n\nBUSINESS PRIORITIES\n'+L('pri')+'\n\nOBJECTIVES\n'+L('obj')+'\n\nCHALLENGES\n'+L('cha')+'\n\nRECENT TOUCHPOINTS\n'+tp;
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el){if(!e.target.closest('.search'))$('res').hidden=true;return;}
  const a=el.dataset.act,v=el.dataset.v;
  if(a==='tab'){S.tab=v;render();window.scrollTo({top:0});}
  else if(a==='nav'){S.tab=el.dataset.tab;render();if(v==='stk')setTimeout(()=>{const p=$('panel-stk');if(p)p.scrollIntoView({behavior:'smooth'});},0);else window.scrollTo({top:0});}
  else if(a==='level'){S.level=v;render();}
  else if(a==='person'){S.person=v;S.level='person';S.tab='priorities';render();window.scrollTo({top:0,behavior:'smooth'});}
  else if(a==='person2'){S.person=v;render();}
  else if(a==='filter'){S.filter=v;render();}
  else if(a==='stage'){S.stage=+v;render();}
  else if(a==='toggle'){S.open[v]=!S.open[v];render();}
  else if(a==='open'){S.open[v]=true;render();setTimeout(()=>{const p=$('acc-'+v);if(p)p.scrollIntoView({behavior:'smooth',block:'start'});},0);}
});
const sel=$('brand');
Object.keys(BR).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=BR[k].name;sel.appendChild(o);});
sel.addEventListener('change',()=>{S.brand=sel.value;S.level='business';S.person='dm';S.filter='all';S.stage=null;render();});

const IDX=[];
Object.keys(BR).forEach(k=>{const b=BR[k];
  IDX.push({k,type:'Client',label:b.name,sub:b.sector,tab:'overview'});
  b.people.forEach(p=>IDX.push({k,type:'Stakeholder',label:p.name,sub:p.role+', '+b.name,tab:'priorities',person:p.id}));
  ['pri','obj','cha'].forEach(c=>b.biz[c].forEach(x=>IDX.push({k,type:'Insight',label:x.t,sub:'Business level, '+b.name,tab:'priorities',lvl:'business'})));
  b.people.forEach(p=>['pri','obj','cha'].forEach(c=>b.per[p.id][c].forEach(x=>IDX.push({k,type:'Insight',label:x.t,sub:p.name+', '+b.name,tab:'priorities',lvl:'person',person:p.id}))));
});
const q=$('q'),res=$('res');
function go(i){const r=IDX[i];S.brand=r.k;S.stage=null;S.tab=r.tab;S.level=r.lvl||(r.type==='Stakeholder'?'person':'business');if(r.person)S.person=r.person;S.filter='all';q.value='';res.hidden=true;render();window.scrollTo({top:0,behavior:'smooth'});}
q.addEventListener('input',()=>{
  const v=q.value.trim().toLowerCase();
  if(v.length<2){res.hidden=true;return;}
  const hits=[];IDX.forEach((r,i)=>{if((r.label+' '+r.sub).toLowerCase().includes(v)&&hits.length<8)hits.push(i);});
  res.innerHTML=hits.length?hits.map(i=>'<button data-i="'+i+'">'+esc(IDX[i].label)+'<small>'+IDX[i].type+', '+esc(IDX[i].sub)+'</small></button>').join(''):'<div style="padding:12px;color:var(--muted)">No matches. Try a client or stakeholder name.</div>';
  res.hidden=false;
  res.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>go(+b.dataset.i)));
});
q.addEventListener('keydown',e=>{if(e.key==='Escape'){res.hidden=true;}if(e.key==='Enter'){const f=res.querySelector('button');if(f)go(+f.dataset.i);}});

const dlg=$('dlg');
$('exp').addEventListener('click',()=>{$('brief').value=brief(cur());$('cp').textContent='';dlg.showModal();});
$('close').addEventListener('click',()=>dlg.close());
$('copy').addEventListener('click',()=>{
  const t=$('brief');t.select();
  let ok=false;try{ok=document.execCommand('copy');}catch(err){}
  $('cp').textContent=ok?'Copied':'Select the text and copy it';
});
render();
</script>
</body>
</html>
